# Lab vector B05. See ../vector.rs for the format.
id = "B05"
title = "An edit asks first, and a rejection keeps the file away"
levels = ["native", "native_bad", "json", "text"]
opts = "writes=1"
cost = "fast"
claims = ["permissions"]

[[step]]
do = "prompt"
text = "permkind edit"

[[step]]
do = "answer"
option = "reject_once"

[[expect]]
turn = 1
asked = "edit"
times = 1

[[expect]]
turn = 1
stop = "end_turn"
text_has = "option:reject_once"

[[expect]]
file = "permkind-edit.txt"
exists = false
