# Lab vector B09. See ../vector.rs for the format.
id = "B09"
title = "Stop ends the turn and the next message works"
levels = ["native", "native_bad", "json", "text"]
opts = ""
cost = "fast"
claims = ["stop"]

[[step]]
do = "prompt"
text = "slow"

[[step]]
do = "cancel"
after_ms = 300

[[step]]
do = "prompt"
text = "stream 2"

[[expect]]
turn = 1
stop = "cancelled"
within_ms = 5000

[[expect]]
turn = 2
stop = "end_turn"
chunks_at_least = 2

[[expect]]
no_orphans = true
