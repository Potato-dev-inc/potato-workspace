# Lab vector S10. See ../vector.rs for the format.
id = "S10"
title = "500, 429, garbage and an empty reply each end cleanly, and the next message works"
levels = ["native"]
opts = ""
cost = "fast"
claims = []

[[step]]
do = "prompt"
text = "rpcerr 500 fetch failed"

[[step]]
do = "prompt"
text = "rpcerr 429 slow down"

[[step]]
do = "prompt"
text = "garbage"

[[step]]
do = "prompt"
text = "empty"

[[step]]
