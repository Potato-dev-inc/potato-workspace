# OpenCode as a chat over ACP: OpenCode runs its own ACP server (`opencode acp`), no adapter to install.
# This file is the `[acp]` table of the OpenCode profile. Facts checked on a real install (OpenCode 1.19.0,
# Windows 11, npm `.cmd` shim, 2026-11-02): `opencode --help` lists `opencode acp  start ACP (Agent Client
# Protocol) server`; `opencode acp` with `initialize` {protocolVersion: 1} answers protocolVersion 1,
# agentInfo OpenCode 1.19.0, loadSession true, sessionCapabilities resume/list/fork/close; `session/new`
# answers `ses_...`, the same id `opencode --session <id>` takes (so "Open in terminal" works). No flag needed.
# Checked again on OpenCode 2.2.7 (2026-11-11): the same `opencode acp` command works (initialize, session/new, session/prompt, session/load; 2.x also offers resume).
# Sign-in is the person's own (`opencode auth login`, stored by OpenCode itself); provider key variables of
# the app's environment are not passed on unless listed in env_allow.
command = "opencode"
args = ["acp"]
env_allow = []

# Added to the normal terminal launch: `opencode --session <session id>`.
resume_command = ["--session", "{session}"]

[addon]
signin_hint = "In the terminal that opens, run `opencode auth login`. Chat uses the same sign-in as the terminal."

# A new chat with no model asked for starts on the model of Settings › Orchestrator & Models › OpenCode model
# (else the one the person picked last), not on OpenCode's own default, which can be a paid model with no credit.
[default_model]
provider_setting = "opencode_model_provider"
model_setting = "opencode_model_id"
provider_fallback = "opencode-go"
separator = "/"
credit_patterns = ["insufficient balance", "insufficient credit", "top up at", "/billing", "model not found", "unknown model", "providermodelnotfound"]
credit_message = "OpenCode's model {model} needs credit. Pick another model in the chat, or set Settings › Orchestrator & Models › OpenCode model."

# A read-only chat. OpenCode runs most tools (edit, write) without asking, so the permission guard alone is not enough: its
# own "plan" agent (a session mode) has editing switched off, and it is selected before the first message. Every
# permission question for an edit, delete, move or command is also rejected by this app. If OpenCode does not take the
# mode, no read-only chat is started.
[read_only]
mode = "plan"
mode_option = "mode"
asks_before_tools = false
