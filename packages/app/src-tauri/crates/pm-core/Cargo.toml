[package]
name = "pm-core"
version = "0.2.2"
description = "Potato Workspace window-free core: paths, secrets, keys, device identity, PC link"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "pm_core"

# Same versions and features as the app (packages/app/src-tauri/Cargo.toml): these crates only moved here.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "process", "io-util", "time", "net"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
once_cell = "1"
tracing = "0.1"
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
toml = "0.8"
keyring = "3.6"
chacha20poly1305 = "0.10"
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
hmac = "0.12"
hkdf = "0.12"
subtle = "2"
bytes = "1"
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
mdns-sd = "=0.13.11"
async-trait = "0.1"
# Added back for the terminals, profiles and stored chats (stage 4): same versions as the app, already in Cargo.lock.
arc-swap = "1"
iana-time-zone = "0.1"
crc32fast = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
portable-pty = "0.8"
vt100 = "0.16"
anyhow = "1"
ureq = { version = "2", features = ["json"] }
toml_edit = "0.20"
shlex = "2"
strsim = "0.11"
serde_path_to_error = "0.1"
glob = "0.3"
notify = "6"
ruzstd = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
semver = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Wire types shared with the team relay (MIT, `relay/protocol` in this repository).
pm-relay-protocol = { path = "../../../../../relay/protocol" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security", "Win32_System_DataExchange", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_RestartManager", "Win32_System_SystemInformation", "Win32_System_Threading"] }
keyring = { version = "3.6", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

[features]
# The app's unit tests switch this on (its [dev-dependencies]): `cfg(test)` does not cross crates, so without it the app's
# tests would use the real credential store, the real device-identity file and the `dev` profile.
test-util = []
# Forwarded from the app's `dev-fake-tui`: the end-to-end harness roots app data in its own folder (`app_paths`).
dev-fake-tui = []
