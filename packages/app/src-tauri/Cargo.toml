[package]
name = "puppet_master_app"
version = "0.2.2"
description = "Potato Workspace desktop app"
authors = ["you"]
edition = "2021"
rust-version = "1.91"
default-run = "puppet_master_app"
autotests = false

[lib]
name = "puppet_master_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "puppet-master-mcp"
path = "src/bin/puppet-master-mcp.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
# "Start Potato Workspace when I sign in": Run entry on Windows, Launch Agent on macOS. Official Tauri
# plugin, MIT OR Apache-2.0 (its auto-launch dependency is MIT). Built against tauri 2.12.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arc-swap = "1"
portable-pty = "0.8"
vt100 = "0.16"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "fs", "process", "io-util", "time", "net"] }
parking_lot = "0.12"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
strsim = "0.11"
# Line diffs for the tamper guard (Apache-2.0).
similar = "2"
once_cell = "1"
shlex = "2"
# Point and Fix (`point/`): PNG decode and encode for the element crop (MIT OR Apache-2.0, already in Cargo.lock).
png = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
anyhow = "1"
ureq = { version = "2", features = ["json"] }
web-push-native = "0.4"
toml = "0.8"
# Edit a TOML file and keep every other byte (comments, order, spacing) as it was; for Model Bridge recipes (MIT OR Apache-2.0, already in Cargo.lock via toml).
toml_edit = "0.20"
serde_path_to_error = "0.1"
glob = "0.3"
notify = "6"
tauri-plugin-global-shortcut = "2"
# Clipboard text for the Ask bar (MIT OR Apache-2.0).
arboard = { version = "3", default-features = false }
# OS credential store for provider API keys (MIT OR Apache-2.0). 3.x: no default stores, pick per OS.
keyring = "3.6"
# Diagnostic file: deflate and checksums for the zip writer in flight/zip.rs (both MIT OR Apache-2.0, already built for ureq).
flate2 = "1"
crc32fast = "1"
# Finished Codex sessions are zstd-compressed (`rollout-*.jsonl.zst`). Pure-Rust decoder (MIT, no C code); needs rustc 1.87.
ruzstd = "0.9"
# Search across all chats (`chat_index/`): SQLite with FTS5, compiled in (the bundled build enables FTS5), so it needs
# no library on the person's machine. Same version the team relay uses. MIT.
rusqlite = { version = "0.32", features = ["bundled"] }
# Version ranges for tested-version pins (MIT OR Apache-2.0).
semver = "1"
# Usage-limit reset times ("resets 5pm", "try again at 9:45 PM") read in the machine's own zone
# (both MIT OR Apache-2.0, already built for tauri; `handoff/reset.rs`).
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
iana-time-zone = "0.1"
# Team ("Heads-up") end-to-end encryption, COWORK-PLAN §8.2 / §12. All MIT OR Apache-2.0
# (RustCrypto / rust-hpke). XChaCha20-Poly1305 seals envelopes; HPKE (RFC 9180, X25519 +
# HKDF-SHA256 + ChaCha20-Poly1305) seals team keys and join requests to one device; HMAC proves an
# invite code. Signatures use the ed25519-dalek above.
chacha20poly1305 = "0.10"
# AES-256-GCM seals Live Room frames (live_room/seal.rs). Same RustCrypto `aead` family as above.
aes-gcm = "0.10"
hpke = { version = "0.12", default-features = false, features = ["alloc", "x25519"] }
hmac = "0.12"
subtle = "2"
# Wire types shared with the team relay (MIT, `relay/protocol` in this repository).
pm-relay-protocol = { path = "../../../relay/protocol" }
bytes = "1"
# The shared PC link (`p2p/`, copied from pm-my-computer): QUIC connections dialed by public key.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
mdns-sd = "=0.13.11"
async-trait = "0.1"

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }
# Point and Fix screenshots: WebView2 CapturePreview. Same versions wry uses, so the
# `controller()` types match (`cargo tree -d` shows one webview2-com).
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell"] }
# Night Shift keep-awake (`night_shift/power.rs`): SetThreadExecutionState. 0.52 is already in Cargo.lock.
windows-sys = { version = "0.52", features = ["Win32_System_Power", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_RestartManager"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["linux-native"] }

# Test-only. `insta` (Apache-2.0) snapshots the decision timelines of the replay corpus
# (`src/replay/`, `tests/corpus/`).
[dev-dependencies]
insta = "1"
# The team relay server, run on a loopback port by the Team end-to-end tests (test-only; its
# licence is pending, see relay/LICENSE, and it is never linked into the app).
pm-relay = { path = "../../../relay/server" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Dev only, never enabled by the app or a release build: the fake agent types (`fake_claude`,
# `fake_codex`) and the in-process harness behind the `pm-fake-tui` end-to-end tests
# (`src/fake_tui/`, `tests/fake_tui_e2e.rs`, `tools/pm-fake-tui/`). Run them with
# `cargo test --features dev-fake-tui --test fake_tui_e2e`.
dev-fake-tui = []

# One integration-test binary (`tests/e2e.rs`): every file under tests/ is a module of it, so the whole app crate is
# linked once, not once per file. The name stays `fake_tui_e2e` so `--test fake_tui_e2e` (CI, scripts, docs) keeps
# working. `autotests = false` (in [package]) stops cargo from also building each tests/*.rs as a binary of its own.
# The fake-agent and What-broke-it modules need `dev-fake-tui` (they root app data in a temp folder, which only
# that feature has, so they never write to the real app data); `hook_emitter` runs without it.
[[test]]
name = "fake_tui_e2e"
path = "tests/e2e.rs"

# Dev and test builds (`test` inherits `dev`): line tables only for this crate (panics and backtraces
# keep file:line) and no debug info for dependencies. Full debug info doubled the target folder
# (6.4 GB -> 2.9 GB without it) and slowed every link; nothing here reads more than line tables. For
# a debugger session, `CARGO_PROFILE_DEV_DEBUG=true` gives this crate full debug info again.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Hot dependencies run optimized in dev and test builds. The unit tests seal, sign and verify thousands of entries
# (ed25519, ChaCha20, SHA-2) and fill SQLite stores; at opt-level 0 that was most of their run time (a 1,200-entry
# fill took 30 s). Only these crates are optimized, so a one-line edit of this crate still rebuilds just as fast.
[profile.dev.package.libsqlite3-sys]
opt-level = 2
[profile.dev.package.rusqlite]
opt-level = 2
[profile.dev.package.ring]
opt-level = 2
[profile.dev.package.curve25519-dalek]
opt-level = 2
[profile.dev.package.ed25519-dalek]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
[profile.dev.package.sha1]
opt-level = 2
[profile.dev.package.chacha20poly1305]
opt-level = 2
[profile.dev.package.chacha20]
opt-level = 2
[profile.dev.package.poly1305]
opt-level = 2
[profile.dev.package.aes-gcm]
opt-level = 2
[profile.dev.package.aes]
opt-level = 2
[profile.dev.package.ghash]
opt-level = 2
[profile.dev.package.polyval]
opt-level = 2
[profile.dev.package.hpke]
opt-level = 2
[profile.dev.package.x25519-dalek]
opt-level = 2
[profile.dev.package.hkdf]
opt-level = 2
[profile.dev.package.hmac]
opt-level = 2
[profile.dev.package.regex]
opt-level = 2
[profile.dev.package.regex-automata]
opt-level = 2
[profile.dev.package.regex-syntax]
opt-level = 2
[profile.dev.package.aho-corasick]
opt-level = 2
[profile.dev.package.memchr]
opt-level = 2
[profile.dev.package.similar]
opt-level = 2
[profile.dev.package.flate2]
opt-level = 2
[profile.dev.package.miniz_oxide]
opt-level = 2
[profile.dev.package.crc32fast]
opt-level = 2
[profile.dev.package.ruzstd]
opt-level = 2
[profile.dev.package.png]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 2
[profile.dev.package.base64]
opt-level = 2
[profile.dev.package.vt100]
opt-level = 2
