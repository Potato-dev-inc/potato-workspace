# cargo-nextest (https://nexte.st): runs every test in its own process. CI uses it for the library,
# binary and fake-agent end-to-end tests; plain `cargo test` still works for all of them.
#
#   cargo nextest run --lib --bins
#   cargo nextest run --features dev-fake-tui --test fake_tui_e2e
#
# No retries anywhere: a test that fails once is a failure (CI found real races this way).

[profile.default]
retries = 0
# A test still running after 60 s is reported as slow; one still running after 10 minutes is a hang
# and is killed (every e2e wait in the suite is bounded well below that).
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.ci]
retries = 0
# Report every failure of the run, not just the first.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"

# Started first in its shard so the rest of the shard runs beside it: two of its turns end on the
# 120 s round timeout by design (see the test), so it takes ~5 minutes whatever else runs.
[[profile.default.overrides]]
filter = "test(=missions::an_agent_that_makes_no_progress_ends_in_the_stuck_card)"
priority = 100

# Local profile (`node scripts/dev/flakes.mjs`, or `cargo nextest run --profile local --lib`).
# A test that fails and then passes on a retry is a FLAKE: the run stays green, and flakes.mjs writes the
# test's name to the flake ledger (D:/pm-night/flakes.log by default) so it gets fixed, not forgotten.
[profile.local]
retries = 2
fail-fast = false
# 30 s is slow, 4 periods (2 minutes) is a hang and the test is killed.
slow-timeout = { period = "30s", terminate-after = 4 }
failure-output = "immediate-final"
final-status-level = "flaky"

[profile.local.junit]
path = "junit.xml"
# Passing retries are kept in the report, so the script can tell "passed on retry" from "passed first time".
store-success-output = false

# The no-progress test ends on two 120 s round timeouts by design (see above): allow it five minutes.
[[profile.local.overrides]]
filter = "test(=missions::an_agent_that_makes_no_progress_ends_in_the_stuck_card)"
slow-timeout = { period = "120s", terminate-after = 4 }
